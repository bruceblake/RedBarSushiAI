version: '3'

services:
  mcp-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbarsushi-mcp
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    environment:
      - MCP_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - mcp-db
      - mcp-redis
      
  mcp-db:
    image: postgres:14-alpine
    container_name: redbarsushi-mcp-db
    environment:
      - POSTGRES_USER=mcp
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=mcp_testing
    volumes:
      - mcp-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    
  mcp-redis:
    image: redis:alpine
    container_name: redbarsushi-mcp-redis
    volumes:
      - mcp-redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mcp-db-data:
  mcp-redis-data: