[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --capture=no

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, may use real services)
    e2e: End-to-end tests (slow, full system)
    slow: Slow running tests
    asyncio: Asynchronous tests

# Async configuration
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */conftest.py
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml