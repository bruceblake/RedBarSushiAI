[pytest]
python_files = test_*.py
testpaths = tests
norecursedirs = tests/e2e

# Exclude e2e tests by default
addopts = --ignore=tests/e2e

# Markers
markers =
    e2e: marks tests as end-to-end tests (deselect with '-m "not e2e"')
    flaky: marks tests as flaky (may need multiple runs to pass)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    external_api: tests that require actual external API access

# Settings for better output
log_cli = True
log_cli_level = INFO