[pytest]
testpaths = tests/unit tests/integration tests/e2e tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: mark a test as an integration test
    e2e: mark a test as an end-to-end test
    use_db_menu: mark a test to use the database for menu operations
    voice: mark a test focused on voice processing
    menu: mark a test focused on menu handling
    order: mark a test focused on order processing
    websocket: mark a test focused on WebSocket communications
    slow: mark test as slow running
log_cli = True
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)