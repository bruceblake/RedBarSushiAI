# Development docker-compose file with ngrok support
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: redbarsushi-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sushi_restaurant
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # Required API Keys (from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Twilio Configuration
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      
      # ConversationRelay Configuration
      CONVERSATION_RELAY_TTS_PROVIDER: ${CONVERSATION_RELAY_TTS_PROVIDER:-ElevenLabs}
      CONVERSATION_RELAY_TTS_VOICE: ${CONVERSATION_RELAY_TTS_VOICE:-rachel}
      CONVERSATION_RELAY_LANGUAGE: ${CONVERSATION_RELAY_LANGUAGE:-en-US}
      
      # Deliverect (Optional)
      DELIVERECT_API_KEY: ${DELIVERECT_API_KEY:-dummy}
      DELIVERECT_CHANNEL_NAME: ${DELIVERECT_CHANNEL_NAME:-redbarsushi}
      
      # App Configuration
      PYTHONPATH: /app
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INITIALIZE_MENU_DATABASE: ${INITIALIZE_MENU_DATABASE:-false}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro  # Read-only for safety
      - ./logs:/app/logs
      - ./.env:/app/.env:ro  # Mount .env file
    networks:
      - redbarsushi-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    container_name: redbarsushi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sushi_restaurant
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Temporarily disabled init scripts - uncomment if needed
      # - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sushi_restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redbarsushi-network

  redis:
    image: redis:7-alpine
    container_name: redbarsushi-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redbarsushi-network
    command: redis-server --appendonly yes

  ngrok:
    image: ngrok/ngrok:latest
    container_name: redbarsushi-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http app:8000 --log stdout
    ports:
      - "4040:4040"  # Ngrok web interface
    depends_on:
      - app
    networks:
      - redbarsushi-network
    restart: unless-stopped

  # Database initialization service (runs once)
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: redbarsushi-db-init
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sushi_restaurant
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./init_db.py:/app/init_db.py:ro
      - ./seed_menu_db.py:/app/seed_menu_db.py:ro
    networks:
      - redbarsushi-network
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "echo 'Waiting for database to be ready...' && 
       sleep 5 && 
       echo 'Initializing database...' && 
       python /app/init_db.py && 
       echo 'Seeding menu data...' && 
       python /app/seed_menu_db.py && 
       echo 'Database initialization complete!'"
    restart: "no"  # Run only once

networks:
  redbarsushi-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: