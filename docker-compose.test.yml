version: '3.8'

services:
  # Simple test setup with PostgreSQL and Redis
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: redbarsushi
      POSTGRES_PASSWORD: redbarsushi
      POSTGRES_DB: redbarsushi_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redbarsushi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://redbarsushi:redbarsushi@postgres-test:5432/redbarsushi_test
      - REDIS_URL=redis://redis-test:6379/0
      - TESTING=true
      - OPENAI_API_KEY=sk-test-key
      - TWILIO_ACCOUNT_SID=ACtest
      - TWILIO_AUTH_TOKEN=test-token
      - DELIVERECT_API_KEY=test-key
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: pytest tests/unit -v