services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: redbarsushi
      POSTGRES_PASSWORD: redbarsushi
      POSTGRES_DB: redbarsushi_test
      # Optimize for testing - faster but less durable
      POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=md5"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redbarsushi -d redbarsushi_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    # Faster startup for tests
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network
    # Redis configuration for testing
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  app-test:
    build:
      context: .
      dockerfile: docker/tests/Dockerfile.test
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://redbarsushi:redbarsushi@postgres-test:5432/redbarsushi_test
      - TEST_DATABASE_URL=postgresql+asyncpg://redbarsushi:redbarsushi@postgres-test:5432/redbarsushi_test
      - REDIS_URL=redis://redis-test:6379/0
      - CELERY_BROKER_URL=redis://redis-test:6379/1
      - CELERY_RESULT_BACKEND=redis://redis-test:6379/1
      - TESTING=true
      - FASTAPI_ENV=test
      - LOG_LEVEL=INFO
      # Add test API keys (use test/dummy keys)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-key}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-ACtest}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-test}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+15551234567}
      - DELIVERECT_API_KEY=${DELIVERECT_API_KEY:-test}
      - DELIVERECT_CLIENT_ID=${DELIVERECT_CLIENT_ID:-test-client}
      - DELIVERECT_CLIENT_SECRET=${DELIVERECT_CLIENT_SECRET:-test-secret}
      - SECRET_KEY=${SECRET_KEY:-test-secret-key-for-testing}
      - PYTHONPATH=/app
      # Test-specific settings
      - PYTEST_WORKERS=auto
      - PYTEST_TIMEOUT=300
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      # Application code
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      
      # Test configuration files
      - ./run-tests.sh:/app/run-tests.sh:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./.coveragerc:/app/.coveragerc:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      
      # Test output directories (read-write)
      - ./test-results:/app/test-results:rw
      - ./coverage:/app/coverage:rw
      - ./htmlcov:/app/htmlcov:rw
      - ./.pytest_cache:/app/.pytest_cache:rw
      
      # Scripts and utilities
      - ./scripts:/app/scripts:ro
      - ./Makefile:/app/Makefile:ro
      
      # Database initialization scripts
      - ./db/init:/docker-entrypoint-initdb.d:ro
      
      # Logs directory for test logs
      - ./test-logs:/app/logs:rw
    command: ./run-tests.sh
    networks:
      - test-network
    # Resource limits for test container
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  postgres-test-data:

networks:
  test-network:
    driver: bridge