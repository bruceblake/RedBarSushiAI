[pytest]
# Configuration for pytest-xdist parallel test execution

# Additional command-line options
addopts = 
    # Use pytest-xdist with auto-detection of CPU cores
    -n auto
    # Show test durations
    --durations=10
    # Verbose output
    -v
    # Strict markers
    --strict-markers

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: mark test as a unit test
    integration: mark test as an integration test
    e2e: mark test as an end-to-end test
    slow: mark test as slow running
    requires_redis: mark test as requiring Redis
    requires_db: mark test as requiring database

# Timeout for tests (in seconds)
timeout = 300

# Async configuration
asyncio_mode = strict

# xdist specific configuration
# Load balance tests across workers
loadscope = function

# Show output from all workers
looponfailroots = tests