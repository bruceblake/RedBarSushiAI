services:
  app:
    build:
      context: ../../
      dockerfile: docker/images/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - ../../.env.development
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/redbarsushi
      - POSTGRES_PASSWORD=postgres
      - FORCE_HEADLESS=true
      - OPENAI_REALTIME_NO_DISPLAY=1
      - CONTAINER_MODE=1
      - VOICE_HANDLER=realtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../app:/app/app
      - ../../logs:/app/logs
      - ../../init_database.py:/app/init_database.py
      - ../../menu_data.json:/app/menu_data.json
      - ../../realtime_debug.sh:/app/realtime_debug.sh
      - ../../app/utils/enhanced_realtime_audio_async.py:/app/app/utils/enhanced_realtime_audio_async.py
    networks:
      - redbarsushi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:14
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-redbarsushi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:6
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  redbarsushi-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: