name: CI

on:
  push:
    branches: [ main, staging, development ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.10, 3.11]
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
    - name: Setup test environment
      run: |
        cp .env.example .env.test || echo "No .env.example file found, skipping"
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.test
        echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.test
        echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env.test
        echo "TWILIO_NUMBER=${{ secrets.TWILIO_NUMBER }}" >> .env.test
        echo "FLASK_ENV=testing" >> .env.test
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testdb" >> .env.test
        echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
        echo "TESTING=true" >> .env.test
    - name: Run tests
      run: pytest --cov=app --cov-report=xml --cov-report=html
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: false
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
        
    - name: Setup test environment
      run: |
        cp .env.example .env.test || echo "No .env.example file found, skipping"
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.test
        echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.test
        echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env.test
        echo "TWILIO_NUMBER=${{ secrets.TWILIO_NUMBER }}" >> .env.test
        echo "FLASK_ENV=testing" >> .env.test
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testdb" >> .env.test
        echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
        echo "TESTING=true" >> .env.test
        
    - name: Run tests
      run: |
        python -m pytest -v --cov=app -k "not test_sms_endpoint and not test_webhook_config and not test_twilio_webhook and not test_order_status_endpoint and not test_deliverect_deep_scan and not test_menu_variant_matching" tests/

    - name: Run linting
      run: |
        pip install flake8
        # Check for critical errors
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Run a second pass with only functional errors (ignoring style issues)
        flake8 app/ --count --select=F --ignore=F401,F403,F405,F541,F901 --statistics || true
        
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify build
      run: |
        python -c "import app; print('Application imports successfully')"

    - name: Set environment for Render deployment
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "DEPLOY_BRANCH=main" >> $GITHUB_ENV
          echo "DEPLOY_ENV=production" >> $GITHUB_ENV
        else
          echo "DEPLOY_BRANCH=staging" >> $GITHUB_ENV
          echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
        fi

    - name: Set Render webhook variable
      run: |
        # Check for RENDER_WEBHOOK_SECRET first, then fall back to RENDER_DEPLOY_HOOK_URL and RENDER_API_KEY
        if [[ -n "${{ secrets.RENDER_WEBHOOK_SECRET }}" ]]; then
          echo "HAS_RENDER_SECRETS=true" >> $GITHUB_ENV
          echo "USING_RENDER_WEBHOOK_SECRET=true" >> $GITHUB_ENV
        elif [[ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" && -n "${{ secrets.RENDER_API_KEY }}" ]]; then
          echo "HAS_RENDER_SECRETS=true" >> $GITHUB_ENV
          echo "USING_RENDER_WEBHOOK_SECRET=false" >> $GITHUB_ENV
        else
          echo "HAS_RENDER_SECRETS=false" >> $GITHUB_ENV
          echo "USING_RENDER_WEBHOOK_SECRET=false" >> $GITHUB_ENV
        fi

    - name: Trigger Render deployment (webhook secret)
      if: success() && env.HAS_RENDER_SECRETS == 'true' && env.USING_RENDER_WEBHOOK_SECRET == 'true'
      run: |
        curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_WEBHOOK_SECRET }}?branch=${{ env.DEPLOY_BRANCH }}"
        echo "Triggered Render deployment for ${{ env.DEPLOY_ENV }} environment using webhook secret"
        
    - name: Trigger Render deployment (legacy method)
      if: success() && env.HAS_RENDER_SECRETS == 'true' && env.USING_RENDER_WEBHOOK_SECRET != 'true'
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}?branch=${{ env.DEPLOY_BRANCH }}" -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
        echo "Triggered Render deployment for ${{ env.DEPLOY_ENV }} environment using legacy method"
        
    - name: Skip Render deployment
      if: success() && env.HAS_RENDER_SECRETS != 'true'
      run: |
        echo "Skipping Render deployment - missing required secrets"
        echo "To enable automatic deployments, set RENDER_DEPLOY_HOOK_URL and RENDER_API_KEY secrets in your repository"