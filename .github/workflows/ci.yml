name: ci
on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.ci.txt

      # 👉  Run **only** unit tests
      - name: Run unit tests
        run: |
          pytest tests/unit --cov=app --cov-report=xml || code=$?
          # pytest exit-code reference: 0=OK, 1=fail, 2=interrupt, 4=usage, **5=no tests**
          if [ "$code" = "5" ]; then
            echo "✅  No unit tests were collected — treating as pass."
            exit 0
          else
            exit "${code}"
          fi
  e2e:
    name: End-to-end tests on Render staging
    needs: build # ← run only after Render deploy step
    runs-on: ubuntu-latest

    steps:
      # 1 ─ Checkout just the tests (you already have the code in repo)
      - uses: actions/checkout@v4

      # 2 ─ Install the *test-only* deps (Playwright core, skip browsers)
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }

      - name: Install E2E dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.ci.txt
          pip install playwright==1.43.0 pytest-playwright

      # 3 ─ Wait until the newly-deployed staging site is healthy
      - name: Wait for Render staging
        env:
          BASE_URL: https://redbarsushi-staging.onrender.com
        run: |
          for i in {1..40}; do
            if curl -fsS "$BASE_URL/health"; then exit 0; fi
            echo "⏳ staging not ready yet…"; sleep 5
          done
          echo "❌ staging never became healthy" >&2
          exit 1

      # 4 ─ Run the Playwright API suite (tests/e2e)
      - name: Run Playwright E2E
        env:
          BASE_URL: https://redbarsushi-staging.onrender.com
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          pytest tests/e2e -v
