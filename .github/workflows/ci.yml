name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_redbarsushi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install PostgreSQL development packages required for psycopg2
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client
        
        # Upgrade pip
        python -m pip install --upgrade pip
        
        # Install dependencies
        pip install -r requirements.txt
        
        # Install Playwright browser dependencies
        python -m playwright install --with-deps
        
    - name: List running services
      run: |
        echo "PostgreSQL container status:"
        docker ps | grep postgres || true
        echo "Redis container status:"
        docker ps | grep redis || true
        
    - name: Basic tests
      run: |
        # Simple health check test
        pytest tests/e2e/test_health_check.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Voice tests
      run: |
        pytest tests/e2e/test_voice_endpoints.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Menu tests
      run: |
        pytest tests/e2e/test_voice_menu_handling.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Order tests
      run: |
        pytest tests/e2e/test_basic_order.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: MCP integration tests
      run: |
        pytest tests/integration/test_mcp_test_integration.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Database integration tests
      run: |
        echo "Setting up database..."
        python -c "from app.models import base; base.Base.metadata.create_all()"
        
        echo "Running conversation store tests..."
        pytest tests/integration/test_conversation_store.py -v
        
        echo "Running menu DB integration tests..."
        pytest tests/integration/test_menu_db_integration.py -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: false
        
  docker-integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Start Docker containers
      run: |
        docker-compose -f tests/docker-compose-test.yml up -d
        
    - name: Wait for Docker containers to be healthy
      run: |
        echo "Waiting for containers to be ready..."
        sleep 10
        docker ps
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install PostgreSQL development packages required for psycopg2
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client
        
        # Upgrade pip
        python -m pip install --upgrade pip
        
        # Install dependencies
        pip install -r requirements.txt
        
        # Install Playwright browser dependencies
        python -m playwright install --with-deps
        
    - name: Run Docker integration tests
      run: |
        chmod +x run_docker_integration_tests.sh
        ./run_docker_integration_tests.sh -n
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: docker
        
    - name: Stop Docker containers
      if: always()
      run: |
        docker-compose -f tests/docker-compose-test.yml down
