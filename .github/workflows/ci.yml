name: ci
on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.ci.txt

      # 👉  Run **only** unit tests
      - name: Run unit tests
        run: |
          pytest tests/unit --cov=app --cov-report=xml || code=$?
          # pytest exit-code reference: 0=OK, 1=fail, 2=interrupt, 4=usage, **5=no tests**
          if [ "$code" = "5" ]; then
            echo "✅  No unit tests were collected — treating as pass."
            exit 0
          else
            exit "${code}"
          fi
