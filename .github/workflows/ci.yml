# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      # 1 – Checkout code
      - uses: actions/checkout@v4

      # 2 – Set up a single Python version
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3 – Optional pip cache (keeps the job fast)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      # 4 – Install dependencies needed for *unit* tests only
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.ci.txt

      # 5 – Provide a bare-bones test env (tweak as needed)
      - name: Minimal test env
        run: |
          echo "FLASK_ENV=testing" >> $GITHUB_ENV
          echo "TESTING=true"      >> $GITHUB_ENV

      # 6 – Run unit tests (skip anything marked e2e)
      - name: Run unit tests
        run: |
          pytest -m "not e2e" --cov=app --cov-report=xml
