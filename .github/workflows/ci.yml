name: ci
on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]

jobs:
  # ─────────────────────── UNIT ─────────────────────── #
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.txt -r requirements.ci.txt
      - run: |
          pytest tests/unit --cov=app --cov-report=xml || code=$?
          if [ "$code" = "5" ]; then exit 0; else exit "$code"; fi

  # ─────────────────── DEPLOY TO RENDER ────────────────── #
  build: # << the job that triggers Render
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK_URL?branch=staging"

  # ───────────────  PLAYWRIGHT E2E AFTER DEPLOY ─────────── #
  e2e:
    name: End-to-end tests on staging
    needs: build # wait for the deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - name: Install E2E deps
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 }
        run: |
          pip install -r requirements.txt -r requirements.ci.txt
          pip install playwright==1.43.0 pytest-playwright
      - name: Wait for staging
        env: { BASE_URL: https://redbarsushi-staging.onrender.com }
        run: |
          for i in {1..40}; do curl -fsS "$BASE_URL" && break; sleep 5; done
      - name: Run E2E
        env:
          BASE_URL: https://redbarsushi-staging.onrender.com
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: pytest tests/e2e -v
