name: Run Main Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests (excluding e2e and certain tests)
        run: |
          python -m pytest -v --cov=app \
            -k "not test_sms_endpoint and not test_webhook_config and not test_twilio_webhook and not test_order_status_endpoint and not test_deliverect_deep_scan and not test_menu_variant_matching" \
            $(find tests -type d -name "e2e" -prune -o -type d -name "[!.]*" -print)
      
      - name: Generate coverage report
        run: |
          python -m pytest --cov=app --cov-report=xml \
            $(find tests -type d -name "e2e" -prune -o -type d -name "[!.]*" -print)
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v1
        with:
          name: coverage-report
          path: coverage.xml