name: PR Checks

on:
  pull_request:
    branches: [ main, staging, development ]
    
  # Add workflow_dispatch to allow manual triggering
  workflow_dispatch:
    
jobs:
  branch-protection:
    name: Branch Protection Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR target branch
        run: |
          # Get the base and head branches from GitHub context
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          echo "Pull request from $SOURCE_BRANCH to $TARGET_BRANCH"
          
          # Check if trying to merge directly to main (not from staging)
          if [[ "$TARGET_BRANCH" == "main" && "$SOURCE_BRANCH" != "staging" ]]; then
            echo "⛔ ERROR: Pull requests to main branch must come from staging branch!"
            echo "Please redirect your PR to the staging branch first."
            exit 1
          fi
          
          echo "✅ Branch flow check passed"
  
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v3
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        pip install -r requirements.txt
        
    - name: Check code style with Black
      run: |
        black --check app tests
        
    - name: Lint with flake8
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - uses: actions/checkout@v3
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
        
    - name: Run Bandit security scan
      run: |
        bandit -r app/ -f json -o bandit-results.json -s B104,B110,B404,B603 || true
    - name: Check for security vulnerabilities (pip-audit)
      run: |
        # Use pip-audit for non-interactive vulnerability scan
        pip-audit -r requirements.txt
        
  api-schema-check:
    name: API Schema Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate API routes
      run: |
        python -c "import app; from app.routes import voice, menu, location, order; print('API routes validated')"

  compatibility-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for deprecated API usage
      run: |
        grep -r "openai.Completion.create" app/ || echo "No deprecated Completion API usage found"
        grep -r "twilio.rest.TwilioClient" app/ || echo "No deprecated Twilio API usage found"
        
    - name: Check for hardcoded credentials
      run: |
        grep -r "AKIA" --include="*.py" . || echo "No AWS credentials found"
        grep -r "sk-" --include="*.py" . || echo "No OpenAI keys found"
        grep -r "AC[a-zA-Z0-9]" --include="*.py" . || echo "No Twilio credentials found"