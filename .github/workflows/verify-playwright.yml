name: Verify Playwright Installation

on:
  # Manually triggered workflow
  workflow_dispatch:
  
  # Run on pull requests to e2e testing related branches
  pull_request:
    branches: [ 'e2e-testing*', 'playwright*' ]
    
jobs:
  verify-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright
          # Install Playwright explicitly
          pip install playwright==1.41.2
          
      - name: Install Playwright browsers and system dependencies
        run: |
          # Install Playwright browsers
          python -m playwright install chromium
          # Install Playwright system dependencies
          python -m playwright install-deps chromium
          
      - name: Install additional system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm-dev libasound2
          
      - name: Create test directories
        run: |
          mkdir -p screenshots
          mkdir -p tests/e2e/test-data
          
      - name: Verify Playwright installation
        run: |
          # Run a simple Python script to verify Playwright is installed correctly
          python -c "from playwright.sync_api import sync_playwright; print('Playwright import successful')"
          
      - name: Run minimal test (direct_test.py)
        run: |
          # Set environment variables
          export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          export TESTING=true
          export DISABLE_OPENAI=true
          export FLASK_ENV=testing
          
          # Run the direct test which is most reliable
          python tests/e2e/direct_test.py
          
      - name: Verify test results
        run: |
          # Check if direct test generated a screenshot
          if [ -f "test-page.png" ]; then
            echo "✅ Basic Playwright test passed"
          else
            echo "❌ Basic Playwright test failed - no test-page.png generated"
            exit 1
          fi
          
          # Check if app screenshot was generated
          if [ -f "homepage.png" ]; then
            echo "✅ App test passed"
          else
            echo "⚠️ App test may have failed - no homepage.png generated"
            # Don't fail the build for this (server might not have started)
          fi
          
      - name: Upload test artifacts
        uses: actions/upload-artifact@v1
        if: always()
        with:
          name: test-screenshots
          path: |
            test-page.png
            homepage.png