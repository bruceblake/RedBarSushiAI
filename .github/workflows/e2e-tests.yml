name: E2E Tests with Real APIs

on:
  # Manually triggered workflow
  workflow_dispatch:
  
  # Uncomment when ready to run on push and PRs
  # push:
  #   branches: [ main, staging ]
  # pull_request:
  #   branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest pytest-playwright python-dotenv requests
          
      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          
      - name: Create test env file with real API keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          DELIVERECT_CLIENT_ID: ${{ secrets.DELIVERECT_CLIENT_ID }}
          DELIVERECT_CLIENT_SECRET: ${{ secrets.DELIVERECT_CLIENT_SECRET }}
        run: |
          cat > .env.test << EOF
          TESTING=true
          FLASK_ENV=testing
          DATABASE_URL=sqlite:///:memory:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          
          # Real API keys for testing
          USE_REAL_API_KEYS=true
          RUN_EXTERNAL_API_TESTS=true
          DISABLE_OPENAI=false
          
          # OpenAI API keys
          OPENAI_API_KEY=${OPENAI_API_KEY}
          
          # Twilio credentials
          TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
          
          # Deliverect credentials
          DELIVERECT_CLIENT_ID=${DELIVERECT_CLIENT_ID}
          DELIVERECT_CLIENT_SECRET=${DELIVERECT_CLIENT_SECRET}
          EOF
          
      - name: Create test directories
        run: |
          mkdir -p screenshots
          mkdir -p tests/e2e/test-data
          
      - name: Install xvfb on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      - name: Run direct E2E test
        run: |
          # First run the direct test which is most reliable (Ubuntu compatible)
          export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          python tests/e2e/direct_test.py
          
      - name: Run API tests
        run: |
          # Start Flask server in background
          FLASK_APP=run.py FLASK_ENV=testing TESTING=true python -m flask run --port=5000 --host=0.0.0.0 &
          
          # Wait for server to start
          sleep 5
          
          # Check if server is running
          curl -s http://localhost:5000/
          
          # Run API tests with Ubuntu compatibility
          export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          python -m pytest tests/e2e/test_api.py -v
          
      - name: Run UI tests with Xvfb (Ubuntu)
        run: |
          # Start Xvfb
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          
          # Wait for Xvfb to start
          sleep 2
          
          # Run the comprehensive test with Xvfb for Ubuntu
          export PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          export HEADED=true
          xvfb-run -a python -m pytest tests/e2e/basic_ui_test.py -v || true
          
      - name: Upload screenshots from directory
        uses: actions/upload-artifact@v1
        if: always()
        with:
          name: test-screenshots-dir
          path: screenshots
          
      - name: Upload screenshots from root
        uses: actions/upload-artifact@v1
        if: always()
        with:
          name: test-screenshots-root
          path: homepage.png
          
      - name: Check for test failures
        run: |
          # Check if direct test passed (it's our critical test)
          if [ ! -f "homepage.png" ]; then
            echo "Direct test failed - no homepage.png generated"
            exit 1
          fi
          
          echo "E2E tests completed successfully"