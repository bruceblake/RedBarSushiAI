name: Test and Deploy

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'

jobs:
  # Unit and Integration Tests - Run on every commit
  test-unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: redbarsushi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Set up test environment
      env:
        DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/redbarsushi_test
        REDIS_URL: redis://localhost:6380/0
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        DELIVERECT_API_KEY: ${{ secrets.DELIVERECT_SANDBOX_API_KEY }}
        DELIVERECT_BASE_URL: https://api.staging.deliverect.com
        FASTAPI_ENV: test
      run: |
        # Initialize test database
        python -m app.db_init
        python seed_menu_db.py
    
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/redbarsushi_test
        REDIS_URL: redis://localhost:6380/0
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/redbarsushi_test
        REDIS_URL: redis://localhost:6380/0
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DELIVERECT_API_KEY: ${{ secrets.DELIVERECT_SANDBOX_API_KEY }}
        DELIVERECT_BASE_URL: https://api.staging.deliverect.com
      run: |
        pytest tests/integration -v --cov=app --cov-append --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Check test coverage
      run: |
        coverage report --fail-under=80

  # Linting and Code Quality
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        pip install ruff black mypy
    
    - name: Run ruff
      run: ruff check app tests
    
    - name: Check formatting with black
      run: black --check app tests
    
    - name: Run mypy type checking
      run: mypy app --ignore-missing-imports

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    needs: [test-unit-integration, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Render Staging
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
      run: |
        curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": true}'

  # E2E Tests - Run after staging deployment
  test-e2e-staging:
    name: E2E Tests (Staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Wait for staging deployment
      run: sleep 60  # Wait for deployment to stabilize
    
    - name: Run E2E tests against staging
      env:
        FASTAPI_ENV: staging
        STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_TEST_PHONE_NUMBER: ${{ secrets.TWILIO_TEST_PHONE_NUMBER }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        DELIVERECT_API_KEY: ${{ secrets.DELIVERECT_SANDBOX_API_KEY }}
      run: |
        pytest tests/e2e -v -m "not slow" --tb=short
    
    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results
        path: test-results/

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    needs: [test-unit-integration, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Render Production
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
      run: |
        curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": true}'

  # Nightly E2E Tests
  nightly-e2e:
    name: Nightly E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run full E2E test suite
      env:
        FASTAPI_ENV: staging
        STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_TEST_PHONE_NUMBER: ${{ secrets.TWILIO_TEST_PHONE_NUMBER }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        DELIVERECT_API_KEY: ${{ secrets.DELIVERECT_SANDBOX_API_KEY }}
      run: |
        pytest tests/e2e -v --tb=short  # Run all E2E tests including slow ones
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Nightly E2E Tests Failed',
            body: 'The nightly E2E test run failed. Please check the logs.'
          })

# Schedule for nightly tests
on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily