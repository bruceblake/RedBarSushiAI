name: Staging CI/CD with E2E Testing

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  unit-and-integration-tests:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_redbarsushi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install PostgreSQL development packages required for psycopg2
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client
        
        # Upgrade pip
        python -m pip install --upgrade pip
        
        # Install psycopg2-binary first to avoid build issues
        pip install --no-build-isolation psycopg2-binary==2.9.9
        
        # Then install the rest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: List running services
      run: |
        echo "PostgreSQL container status:"
        docker ps | grep postgres || true
        echo "Redis container status:"
        docker ps | grep redis || true
        
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Run integration tests
      run: |
        # Create database tables
        python -c "from app.models import base; base.Base.metadata.create_all()"
        
        # Run integration tests
        python -m pytest tests/integration/ -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: false

  docker-integration-tests:
    name: Run Docker Integration Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Start Docker containers
      run: |
        docker-compose -f tests/docker-compose-test.yml up -d
        
    - name: Wait for Docker containers to be healthy
      run: |
        echo "Waiting for containers to be ready..."
        sleep 10
        docker ps
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install PostgreSQL development packages required for psycopg2
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client
        
        # Upgrade pip
        python -m pip install --upgrade pip
        
        # Install psycopg2-binary first to avoid build issues
        pip install --no-build-isolation psycopg2-binary==2.9.9
        
        # Then install the rest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Docker integration tests
      run: |
        chmod +x run_docker_integration_tests.sh
        ./run_docker_integration_tests.sh -n
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: docker

    - name: Stop Docker containers
      if: always()
      run: |
        docker-compose -f tests/docker-compose-test.yml down

  deploy-to-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, docker-integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Render CLI
      run: |
        curl -o render https://render.com/download-cli/latest/render-linux-amd64
        chmod +x render
        sudo mv render /usr/local/bin/

    - name: Deploy to Render Staging
      run: |
        echo "Deploying to Render staging environment..."
        render deploy-hook "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
        echo "Deployment triggered. It may take a few minutes to complete."
    
    - name: Wait for deployment to complete
      run: |
        echo "Waiting for deployment to complete (5 minutes)"
        sleep 300

  e2e-tests:
    name: Run E2E Tests Against Staging
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run basic health check
      run: |
        export BASE_URL=https://redbarsushiai-staging.onrender.com
        export TESTING=true
        export SKIP_DB_INIT=true
        export TEST_MODE=staging
        python test_staging.py
    
    - name: Run voice endpoint tests
      run: |
        export BASE_URL=https://redbarsushiai-staging.onrender.com
        export TESTING=true
        export SKIP_DB_INIT=true
        export TEST_MODE=staging
        python -m pytest tests/e2e/test_voice_endpoints.py -v
    
    - name: Run menu tests
      run: |
        export BASE_URL=https://redbarsushiai-staging.onrender.com
        export TESTING=true
        export SKIP_DB_INIT=true
        export TEST_MODE=staging
        python -m pytest tests/e2e/test_voice_menu_handling.py -v
    
    - name: Run basic order tests
      run: |
        export BASE_URL=https://redbarsushiai-staging.onrender.com
        export TESTING=true
        export SKIP_DB_INIT=true
        export TEST_MODE=staging
        python -m pytest tests/e2e/test_basic_order.py -v