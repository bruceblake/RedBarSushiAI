name: Staging CI/CD with E2E Testing

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  deploy-to-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, docker-integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Render CLI
        run: |
          curl -o render https://render.com/download-cli/latest/render-linux-amd64
          chmod +x render
          sudo mv render /usr/local/bin/

      - name: Deploy to Render Staging
        run: |
          echo "Deploying to Render staging environment..."
          render deploy-hook "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
          echo "Deployment triggered. It may take a few minutes to complete."

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to complete (5 minutes)"
          sleep 300

  e2e-tests:
    name: Run E2E Tests Against Staging
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: E2E Tests
        run: |
          export BASE_URL=https://redbarsushiai-staging.onrender.com
          export TESTING=true
          export SKIP_DB_INIT=true
          export TEST_MODE=staging
          python -m pytest tests/e2e/test_voice_flow.py -v
