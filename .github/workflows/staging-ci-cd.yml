name: Staging CI/CD with E2E Testing

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  deploy-to-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Render Staging using Webhook
        run: |
          echo "Deploying to Render staging environment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered. It may take a few minutes to complete."

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment to respond..."
          max_retries=20
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if curl -s https://redbarsushiai-staging.onrender.com/ > /dev/null; then
              echo "Deployment complete! Site is responding."
              break
            fi
            retry_count=$((retry_count+1))
            echo "Waiting for deployment... ($retry_count/$max_retries)"
            sleep 30
          done
          if [ $retry_count -eq $max_retries ]; then
            echo "Warning: Deployment response check timed out, continuing anyway"
          fi

  e2e-tests:
    name: Run E2E Tests Against Staging
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: E2E Tests
        env:
          BASE_URL: https://redbarsushiai-staging.onrender.com
          TESTING: true
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Run simplified E2E tests that just make endpoint calls
          python -m pytest tests/e2e/test_simple_endpoints.py -v
          
          # Only run more complex tests if simple ones succeed
          if [ $? -eq 0 ]; then
            echo "Basic tests passed. Attempting full voice flow tests..."
            python -m pytest tests/e2e/test_voice_flow.py -v || echo "Full voice flow tests failed but we'll proceed anyway"
          fi