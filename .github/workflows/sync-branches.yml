name: Sync Branches

on:
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      direction:
        description: 'Sync direction'
        required: true
        default: 'main-to-staging'
        type: choice
        options:
          - 'main-to-staging'
          - 'staging-to-development'
          - 'sync-all'
  
  # Optionally also run this on a schedule, e.g., daily
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC every day

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
      
      - name: Sync main to staging
        if: github.event.inputs.direction == 'main-to-staging' || github.event.inputs.direction == 'sync-all' || github.event_name == 'schedule'
        run: |
          # Only continue if there are changes to sync
          git fetch origin main staging
          DIFF_COUNT=$(git rev-list --count staging..origin/main)
          
          if [ "$DIFF_COUNT" -gt "0" ]; then
            echo "Found $DIFF_COUNT commits to sync from main to staging"
            
            # Create a new branch for the PR
            SYNC_BRANCH="sync/main-to-staging-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$SYNC_BRANCH" origin/main
            
            # Push the branch
            git push origin "$SYNC_BRANCH"
            
            # Create PR using GitHub CLI if installed, otherwise output instructions
            if command -v gh &> /dev/null; then
              gh pr create --base staging --head "$SYNC_BRANCH" \
                --title "Sync: Main → Staging" \
                --body "This is an automated PR to sync changes from main to staging branch."
              echo "Created PR from $SYNC_BRANCH to staging"
            else
              echo "GitHub CLI not installed. Please create a PR manually:"
              echo "From: $SYNC_BRANCH"
              echo "To: staging"
              echo "Title: Sync: Main → Staging"
            fi
          else
            echo "No changes to sync from main to staging"
          fi
      
      - name: Sync staging to development
        if: github.event.inputs.direction == 'staging-to-development' || github.event.inputs.direction == 'sync-all' || github.event_name == 'schedule'
        run: |
          # Check if development branch exists first
          if git ls-remote --heads origin development | grep -q development; then
            git fetch origin staging development
            DIFF_COUNT=$(git rev-list --count development..origin/staging)
            
            if [ "$DIFF_COUNT" -gt "0" ]; then
              echo "Found $DIFF_COUNT commits to sync from staging to development"
              
              # Create a new branch for the PR
              SYNC_BRANCH="sync/staging-to-development-$(date +%Y%m%d%H%M%S)"
              git checkout -b "$SYNC_BRANCH" origin/staging
              
              # Push the branch
              git push origin "$SYNC_BRANCH"
              
              # Create PR using GitHub CLI if installed, otherwise output instructions
              if command -v gh &> /dev/null; then
                gh pr create --base development --head "$SYNC_BRANCH" \
                  --title "Sync: Staging → Development" \
                  --body "This is an automated PR to sync changes from staging to development branch."
                echo "Created PR from $SYNC_BRANCH to development"
              else
                echo "GitHub CLI not installed. Please create a PR manually:"
                echo "From: $SYNC_BRANCH"
                echo "To: development"
                echo "Title: Sync: Staging → Development" 
              fi
            else
              echo "No changes to sync from staging to development"
            fi
          else
            echo "Development branch does not exist, skipping sync"
          fi