name: Staging CD Pipeline

on:
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: 'Run E2E tests after deployment'
        required: false
        default: 'true'
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_redbarsushi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        # Install PostgreSQL client and dev packages
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client
        
        # Install Python dependencies
        python -m pip install --upgrade pip
        pip install --no-build-isolation psycopg2-binary==2.9.9
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: true
        
    - name: Run integration tests
      run: |
        python -c "from app.models import base; base.Base.metadata.create_all()"
        python -m pytest tests/integration/ -v
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: ci
        SKIP_DB_SETUP: false
        
    - name: Run Docker integration tests
      run: |
        docker-compose -f tests/docker-compose-test.yml up -d
        sleep 10
        chmod +x run_docker_integration_tests.sh
        ./run_docker_integration_tests.sh -n
      env:
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_redbarsushi
        TEST_REDIS_URL: redis://localhost:6379/0
        TEST_MODE: docker

  deploy:
    name: Deploy to Render Staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Render CLI
      run: |
        curl -o render https://render.com/download-cli/latest/render-linux-amd64
        chmod +x render
        sudo mv render /usr/local/bin/

    - name: Deploy to Render Staging
      run: |
        echo "Deploying to Render staging environment..."
        render deploy --env staging \
          ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        echo "Deployment triggered. It may take a few minutes to complete."
    
    - name: Wait for deployment
      run: |
        echo "Waiting for deployment to complete (5 minutes)"
        sleep 300

  e2e-tests:
    name: Run E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.run_e2e_tests == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        # Install system dependencies
        sudo apt-get update
        sudo apt-get install -y curl jq xvfb

        # Install Python core dependencies
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Try to install Playwright but don't fail if it doesn't work
        echo "Attempting to install Playwright dependencies..."
        pip install -r requirements.e2e.txt || echo "Warning: Failed to install some E2E dependencies"
        
        # Try to install Playwright browsers, but don't fail if it doesn't work
        echo "Attempting to install Playwright browsers..."
        python -m playwright install --with-deps chromium || echo "Warning: Failed to install Playwright browsers (tests will still run using requests fallback)"
        
        # Install requests library as a fallback
        pip install requests==2.32.3
    
    - name: Run API health check
      run: |
        # Wait for 30 seconds to ensure deployment is complete and services are running
        echo "Waiting for staging environment to be fully available..."
        sleep 30
        
        # Try to reach the health endpoint up to 5 times
        max_retries=5
        retry_count=0
        
        while [ $retry_count -lt $max_retries ]; do
          response=$(curl -s -o /dev/null -w "%{http_code}" https://redbarsushiai-staging.onrender.com/health)
          
          if [ "$response" == "200" ]; then
            echo "Staging environment is responsive with status code $response"
            break
          else
            retry_count=$((retry_count+1))
            echo "Attempt $retry_count: Staging environment returned status code $response. Waiting 30 seconds..."
            sleep 30
          fi
          
          if [ $retry_count -eq $max_retries ]; then
            echo "ERROR: Staging environment is not responding properly after $max_retries attempts."
            exit 1
          fi
        done
    
    - name: Run E2E tests
      run: |
        # Make the script executable
        chmod +x run_e2e_tests.sh
        
        # Create directories for tests
        mkdir -p tests/e2e/reports
        
        # Start Xvfb for headless browser tests
        echo "Starting Xvfb for headless browser testing..."
        Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
        export DISPLAY=:99.0
        
        # Verify Playwright installation
        echo "Verifying Playwright installation..."
        python -c "import playwright" || pip install playwright
        python -m playwright install --with-deps chromium
        
        # Run E2E tests against staging with specific patterns
        echo "Running E2E tests against staging..."
        ./run_e2e_tests.sh \
          --mode staging \
          --pattern "tests/e2e/test_health_check.py tests/e2e/test_voice_endpoints.py" \
          --verbose
      env:
        BASE_URL: https://redbarsushiai-staging.onrender.com
        TEST_MODE: staging
        TESTING: true
        SKIP_DB_INIT: true
        SKIP_DB_SETUP: true
        DISPLAY: :99.0
        PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
    
    - name: Run comprehensive E2E tests
      run: |
        # Ensure Xvfb is still running, restart if needed
        if ! ps aux | grep -v grep | grep -q "Xvfb :99"; then
          echo "Restarting Xvfb for headless browser testing..."
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99.0
        fi
        
        # Run all E2E tests against staging with Playwright support
        echo "Running comprehensive E2E tests against staging..."
        ./run_e2e_tests.sh \
          --mode staging \
          --pattern "tests/e2e/test_*.py" \
          --verbose
      env:
        BASE_URL: https://redbarsushiai-staging.onrender.com
        TEST_MODE: staging
        TESTING: true
        SKIP_DB_INIT: true
        SKIP_DB_SETUP: true
        DISPLAY: :99.0
        PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
    
    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-reports
        path: tests/e2e/reports/
        retention-days: 14

  notify:
    name: Send Deployment Notification
    needs: [deploy, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Determine deployment status
      id: status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "message=✅ Staging deployment and E2E tests completed successfully\!" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "message=⚠️ Staging deployment successful but E2E tests failed. Check logs for details." >> $GITHUB_OUTPUT
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "message=✅ Staging deployment completed successfully\! (E2E tests skipped)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          fi
        else
          echo "message=❌ Staging deployment failed. Check logs for details." >> $GITHUB_OUTPUT
          echo "status=failure" >> $GITHUB_OUTPUT
        fi
    
    - name: Send Slack notification
      if: ${{ secrets.SLACK_WEBHOOK_URL \!= '' }}
      uses: slackapi/slack-github-action@v1.23.0
      with:
        payload: |
          {
            "text": "${{ steps.status.outputs.message }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*RedBarSushiAI Staging Deployment*\n${{ steps.status.outputs.message }}"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\nWorkflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    
    - name: Send email notification
      if: ${{ secrets.NOTIFICATION_EMAIL \!= '' }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: RedBarSushiAI Staging Deployment - ${{ steps.status.outputs.status }}
        body: |
          ${{ steps.status.outputs.message }}
          
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          
          Check the GitHub Actions logs for more details:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
