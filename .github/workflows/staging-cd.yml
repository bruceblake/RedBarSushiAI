name: CD - Staging Deployment

on:
  workflow_run:
    workflows: ["CI"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: staging
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
      
    - name: Set up environment
      run: |
        echo "DEPLOY_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        
    - name: Create deployment tag
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        TAG_NAME="deploy-staging-$(date -u +'%Y%m%d%H%M%S')"
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME" || echo "Warning: Could not push tag $TAG_NAME to remote repository. This could be due to permission issues."
        
    - name: Check for Render secrets
      run: |
        # Check for both new style webhook secret and old style hooks+API key
        if [[ -n "${{ secrets.RENDER_STAGING_WEBHOOK_SECRET }}" ]]; then
          echo "HAS_RENDER_SECRETS=true" >> $GITHUB_ENV
          echo "USING_WEBHOOK_SECRET=true" >> $GITHUB_ENV
        elif [[ -n "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" && -n "${{ secrets.RENDER_API_KEY }}" ]]; then
          echo "HAS_RENDER_SECRETS=true" >> $GITHUB_ENV
          echo "USING_WEBHOOK_SECRET=false" >> $GITHUB_ENV
        else
          echo "HAS_RENDER_SECRETS=false" >> $GITHUB_ENV
          echo "USING_WEBHOOK_SECRET=false" >> $GITHUB_ENV
        fi
          
    - name: Trigger Render deployment (webhook secret)
      if: env.HAS_RENDER_SECRETS == 'true' && env.USING_WEBHOOK_SECRET == 'true'
      run: |
        curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_STAGING_WEBHOOK_SECRET }}?branch=staging" | tee render-deploy-log.txt
        echo "Triggered Render staging deployment using webhook secret"
        
    - name: Trigger Render deployment (legacy)
      if: env.HAS_RENDER_SECRETS == 'true' && env.USING_WEBHOOK_SECRET == 'false'
      run: |
        curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" | tee render-deploy-log.txt
        echo "Triggered Render staging deployment using legacy method"
          
    - name: Skip Render deployment
      if: env.HAS_RENDER_SECRETS != 'true'
      run: |
        echo "Skipping Render deployment - missing required secrets"
        echo "To enable automatic deployments, set RENDER_STAGING_WEBHOOK_SECRET or both RENDER_STAGING_DEPLOY_HOOK and RENDER_API_KEY secrets in your repository"
          
    - name: Check for Slack webhook
      run: |
        if [[ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
          echo "HAS_SLACK_WEBHOOK=true" >> $GITHUB_ENV
        else
          echo "HAS_SLACK_WEBHOOK=false" >> $GITHUB_ENV
        fi

    - name: Notify deployment status
      if: always() && env.HAS_SLACK_WEBHOOK == 'true'
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ Staging deployment complete"
        else
          STATUS="❌ Staging deployment failed"
        fi
        
        curl -X POST -H "Content-Type: application/json" -d '{
          "text": "'"$STATUS"' for RedBarSushiAI.\nBranch: staging\nCommit: ${{ github.sha }}\nTime: ${{ env.DEPLOY_TIME }}"
        }' ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Slack notification failed"
        
    - name: Skip Slack notification
      if: env.HAS_SLACK_WEBHOOK != 'true'
      run: echo "Skipping Slack notification - SLACK_WEBHOOK_URL not set"