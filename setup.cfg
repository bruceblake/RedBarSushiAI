[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist
ignore = E203, W503, W291, W293, E501
per-file-ignores =
    app/utils/deliverect.py:F824
    app/routes/menu.py:F401
    app/utils/menu_utils.py:F401,F811,F541
    app/utils/realtime_audio.py:F401,F821

[tool:pytest]
testpaths = tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    audio: marks tests requiring audio functionality
filterwarnings =
    ignore::DeprecationWarning:.*twilio.*
    ignore::DeprecationWarning:tests.*
    ignore::pytest.PytestConfigWarning:.*asyncio_mode.*
    ignore::pytest.PytestConfigWarning:.*asyncio_default_fixture_loop_scope.*