services:
  # Main web service for production
  - type: web
    name: redbarsushi-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gevent --workers=1 --threads=4 'run:app'
    envVars:
      - key: PROCESS
        value: web
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      # The remaining environment variables will need to be added
      # in the Render dashboard after deployment

  # Staging web service
  - type: web
    name: redbarsushi-staging
    env: python
    branch: staging
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gevent --workers=1 --threads=4 'run:app'
    envVars:
      - key: PROCESS
        value: web
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_ENV
        value: staging
      - key: IS_STAGING
        value: "true"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      # The remaining environment variables will need to be added
      # in the Render dashboard after deployment

  # Celery worker for production
  - type: worker
    name: redbarsushi-celery
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./fix_celery.sh
    envVars:
      - key: PROCESS
        value: celery
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      # The remaining environment variables will need to be added
      # in the Render dashboard after deployment

  # Celery worker for staging
  - type: worker
    name: redbarsushi-staging-celery
    env: python
    branch: staging
    buildCommand: pip install -r requirements.txt
    startCommand: ./fix_celery.sh
    envVars:
      - key: PROCESS
        value: celery
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_ENV
        value: staging
      - key: IS_STAGING
        value: "true"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      # The remaining environment variables will need to be added
      # in the Render dashboard after deployment

  # Redis for production
  - type: redis
    name: redbarsushi-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    plan: free
    
  # Redis for staging
  - type: redis
    name: redbarsushi-staging-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    plan: free