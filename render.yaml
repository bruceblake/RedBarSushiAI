###############################################################################
# render.yaml - RedBar Sushi AI (production + staging + e2e job)              #
###############################################################################
# render.yaml - RedBar Sushi AI (production + staging + e2e job)              #
###############################################################################

services:
  # ─────────────────────────  PRODUCTION STACK  ───────────────────────── #
  - type: web
    name: redbarsushi-web
    runtime: python
    buildCommand: |
      # Install ALL dependencies using our comprehensive script
      chmod +x ./install_all_dependencies.sh
      ./install_all_dependencies.sh
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 2 --bind 0.0.0.0:$PORT --timeout 120 'run:app'
    envVars:
      - key: PROCESS
        value: web
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FORCE_HEADLESS
        value: "true"
      - key: DB_MAX_RETRIES
        value: "5"
      - key: DB_INITIAL_RETRY_DELAY
        value: "1.0"
      - key: DB_MAX_RETRY_DELAY
        value: "30.0"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString

  - type: worker
    name: redbarsushi-celery
    runtime: python
    buildCommand: |
      # Install ALL dependencies using our comprehensive script
      chmod +x ./install_all_dependencies.sh
      ./install_all_dependencies.sh
    startCommand: ./fix_celery.sh
    envVars:
      - key: PROCESS
        value: celery
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_MAX_RETRIES
        value: "5"
      - key: DB_INITIAL_RETRY_DELAY
        value: "1.0"
      - key: DB_MAX_RETRY_DELAY
        value: "30.0"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-redis
          type: redis
          property: connectionString

  - type: redis
    name: redbarsushi-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # ───────────────────────────  STAGING STACK  ────────────────────────── #
  - type: web
    name: redbarsushi-staging
    branch: staging
    runtime: python
    buildCommand: |
      # Install ALL dependencies using our comprehensive script
      chmod +x ./install_all_dependencies.sh
      ./install_all_dependencies.sh
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 2 --bind 0.0.0.0:$PORT --timeout 120 'run:app'
    envVars:
      - key: PROCESS
        value: web
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FORCE_HEADLESS
        value: "true"
      - key: FLASK_ENV
        value: staging
      - key: IS_STAGING
        value: "true"
      - key: DB_MAX_RETRIES
        value: "5"
      - key: DB_INITIAL_RETRY_DELAY
        value: "1.0"
      - key: DB_MAX_RETRY_DELAY
        value: "30.0"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString

  - type: worker
    name: redbarsushi-staging-celery
    branch: staging
    runtime: python
    buildCommand: |
      # Install ALL dependencies using our comprehensive script
      chmod +x ./install_all_dependencies.sh
      ./install_all_dependencies.sh
    startCommand: ./fix_celery.sh
    envVars:
      - key: PROCESS
        value: celery
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FLASK_ENV
        value: staging
      - key: IS_STAGING
        value: "true"
      - key: DB_MAX_RETRIES
        value: "5"
      - key: DB_INITIAL_RETRY_DELAY
        value: "1.0"
      - key: DB_MAX_RETRY_DELAY
        value: "30.0"
      - key: REDIS_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redbarsushi-staging-redis
          type: redis
          property: connectionString

  - type: redis
    name: redbarsushi-staging-redis
    branch: staging
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # ─────────────────────  PLAYWRIGHT E2E JOB (staging)  ───────────────────── #
  - type: job
    name: redbarsushi-staging-e2e
    branch: staging
    env: python
    buildCommand: |
      # Install system dependencies first
      apt-get update && apt-get install -y portaudio19-dev libportaudio2 libportaudiocpp0 python3-dev ffmpeg build-essential
      
      # Install all dependencies
      chmod +x ./install_all_dependencies.sh
      ./install_all_dependencies.sh
      
      # Install testing-specific dependencies
      pip install playwright==1.43.0 pytest-playwright
    startCommand: |
      # Wait for staging to be available
      until curl -fsS https://redbarsushi-staging.onrender.com/health; do
        echo "⏳ waiting for staging…"; sleep 5; done
      
      # Run tests with proper environment
      export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      export BASE_URL=https://redbarsushi-staging.onrender.com
      chmod +x ./run_e2e_tests.sh
      ./run_e2e_tests.sh
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
