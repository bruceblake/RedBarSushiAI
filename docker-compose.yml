version: "3.8"

services:
  web:
    build: .
    image: redbar-sushi-ai
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - PROCESS=web
      - DB_MAX_RETRIES=5
      - DB_INITIAL_RETRY_DELAY=1.0
      - DB_MAX_RETRY_DELAY=30.0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
    networks:
      - redbar-network

  celery-worker:
    image: redbar-sushi-ai
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PROCESS=celery
      - DB_MAX_RETRIES=5
      - DB_INITIAL_RETRY_DELAY=1.0
      - DB_MAX_RETRY_DELAY=30.0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
      - web
    networks:
      - redbar-network

  celery-beat:
    image: redbar-sushi-ai
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PROCESS=celery-beat
      - DB_MAX_RETRIES=5
      - DB_INITIAL_RETRY_DELAY=1.0
      - DB_MAX_RETRY_DELAY=30.0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
      - web
    networks:
      - redbar-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - redbar-network

  db:
    image: postgres:14-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-redbar_sushi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redbar-network

  # Test service for running CI-like checks inside Docker
  test:
    build:
      context: .
      target: final
    image: redbar-sushi-test
    entrypoint: ["bash", "-lc"]
    env_file:
      - .env.test

    environment:
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 # skip big browser downloads
      - BASE_URL=http://web:8080

    volumes:
      - .:/app
    working_dir: /app
    # Execute CI-style steps in a single shell script
    command: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      pip install -r requirements.ci.txt &&
      pip install black ruff &&
      black --check app tests || true &&
      flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics &&
      flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics &&
      ruff check app tests --exit-zero || true &&
      pytest -m "not integration and not load" -v &&
      pytest -m "integration" -v &&
      pytest tests/api -v &&
    depends_on:
      - redis
      - db
    networks:
      - redbar-network

volumes:
  redis-data:
  postgres-data:

networks:
  redbar-network:
    driver: bridge
