version: '3.8'

services:
  web:
    build: .
    image: redbar-sushi-ai
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - PROCESS=web
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
    networks:
      - redbar-network

  celery-worker:
    image: redbar-sushi-ai
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PROCESS=celery
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
      - web
    networks:
      - redbar-network

  celery-beat:
    image: redbar-sushi-ai
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PROCESS=celery-beat
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - db
      - web
    networks:
      - redbar-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - redbar-network

  db:
    image: postgres:14-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-redbar_sushi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redbar-network

volumes:
  redis-data:
  postgres-data:

networks:
  redbar-network:
    driver: bridge