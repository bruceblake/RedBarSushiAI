# Development docker-compose file
# Usage: docker-compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbarsushi-app
    ports:
      - "${APP_PORT:-8000}:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/redbarsushi
      REDIS_URL: redis://redis:6379/0
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      PYTHONPATH: /app
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-for-development}
      APP_SECRET_KEY: ${SECRET_KEY:-your-secret-key-for-development}
      # Twilio settings
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Deliverect settings
      DELIVERECT_API_KEY: ${DELIVERECT_API_KEY:-}
      DELIVERECT_CHANNEL_NAME: ${DELIVERECT_CHANNEL_NAME:-redbarsushi}
      # Other settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORCE_HEADLESS: "true"
      VOICE_HANDLER: ${VOICE_HANDLER:-conversation_relay}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./tests:/app/tests
    networks:
      - redbarsushi-network
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    container_name: redbarsushi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redbarsushi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network

  redis:
    image: redis:7-alpine
    container_name: redbarsushi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbarsushi-celery
    command: celery -A celery_app_fastapi worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/redbarsushi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-for-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FORCE_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./celery_app_fastapi.py:/app/celery_app_fastapi.py
    networks:
      - redbarsushi-network

networks:
  redbarsushi-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: