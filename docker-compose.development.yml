version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/images/Dockerfile
    container_name: redbarsushi-app-dev
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./init_database.py:/app/init_database.py
      - ./menu_data.json:/app/menu_data.json
    networks:
      - redbarsushi-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/bin/bash", "-c", "cd /app && ./docker/fix_pydantic_version.sh && uvicorn main:app --host 0.0.0.0 --port 8080 --workers 1 --log-level debug"]

  postgres:
    image: postgres:14
    container_name: redbarsushi-postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-redbarsushi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:6
    container_name: redbarsushi-redis-dev
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  redbarsushi-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data: