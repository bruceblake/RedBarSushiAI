version: '3.8'

services:
  fastmcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile.fastmcp
    ports:
      - "${MCP_PORT:-4000}:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/redbarsushi
      - REDIS_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=4000
      - TRANSPORT=sse
      - CONTAINER_MODE=1
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - DEBUG=${DEBUG:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - redbarsushi-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./mcp:/app/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=redbarsushi
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # Map to 5433 to avoid conflicts with local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mcp/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:6
    ports:
      - "${REDIS_PORT:-6380}:6379"  # Map to 6380 to avoid conflicts with local Redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - redbarsushi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  redbarsushi-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: