version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbarsushi-app-dev
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://app_user:password@postgres:5432/redbarsushi
      - DB_USER=app_user
      - DB_PASSWORD=password
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=redbarsushi
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=redbarsushi
      - REDIS_URL=redis://redis:6379/0
      - TWILIO_ACCOUNT_SID=ACb8391ed8d92871d85180ca9adea481b6
      - TWILIO_AUTH_TOKEN=8bbdc0c60316d163ee36c58af5f35154
      - TWILIO_PHONE_NUMBER=+17036467799
      - STRIPE_API_KEY=dummy-key-for-development
      - OPENAI_API_KEY=sk-mytestapikey
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./:/app/
    networks:
      - redbarsushi-network
    restart: always
    command: ["/bin/bash", "-c", "sleep 10 && echo 'Starting server...' && uvicorn main:app --host 0.0.0.0 --port 8080 --workers 1 --log-level debug"]

  postgres:
    image: postgres:14
    container_name: redbarsushi-postgres-dev
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: redbarsushi
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redbarsushi-network
    restart: always

  redis:
    image: redis:6
    container_name: redbarsushi-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - redbarsushi-network
    restart: always

networks:
  redbarsushi-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
